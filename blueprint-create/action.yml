name: 'Lissto Blueprint Create'
description: 'Create a Lissto blueprint from a docker-compose file'
author: 'lissto-dev'

branding:
  icon: 'box'
  color: 'blue'

inputs:
  api-key:
    description: 'Lissto API key'
    required: true
  api-url:
    description: 'Lissto API URL'
    required: true
  compose-file:
    description: 'Path to docker-compose file'
    required: false
    default: 'docker-compose.yml'
  repository:
    description: 'Repository URL (auto-detected from GitHub context if not provided)'
    required: false
  branch:
    description: 'Git branch name (auto-detected from GitHub context if not provided)'
    required: false
  author:
    description: 'Author name (auto-detected from GitHub actor if not provided)'
    required: false
  cli-version:
    description: 'Lissto CLI version to use (default: latest)'
    required: false
    default: 'latest'

outputs:
  blueprint-id:
    description: 'The created blueprint ID'

runs:
  using: 'docker'
  image: 'Dockerfile'
