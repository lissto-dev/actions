name: 'Lissto Deploy'
description: 'Deploy a stack to Lissto (creates blueprint if needed)'
author: 'Lissto'

inputs:
  api-key:
    description: 'Lissto API key'
    required: true
  api-url:
    description: 'Lissto API URL'
    required: true
  environment:
    description: 'Target environment'
    required: true
  compose-file:
    description: 'Path to docker-compose file'
    default: 'docker-compose.yml'
  blueprint-id:
    description: 'Existing blueprint ID (skips blueprint creation)'
    required: false
  branch:
    description: 'Git branch for image version'
    required: false
  tag:
    description: 'Image tag'
    required: false
  commit:
    description: 'Commit SHA for image version'
    required: false

outputs:
  blueprint-id:
    description: 'Blueprint ID'
  stack-id:
    description: 'Created stack ID'
  stack-url:
    description: 'Stack URL (if exposed)'

runs:
  using: 'docker'
  image: '../src/Dockerfile'
  env:
    LISSTO_ACTION: deploy
    INPUT_API_KEY: ${{ inputs.api-key }}
    INPUT_API_URL: ${{ inputs.api-url }}
    INPUT_ENVIRONMENT: ${{ inputs.environment }}
    INPUT_COMPOSE_FILE: ${{ inputs.compose-file }}
    INPUT_BLUEPRINT_ID: ${{ inputs.blueprint-id }}
    INPUT_BRANCH: ${{ inputs.branch }}
    INPUT_TAG: ${{ inputs.tag }}
    INPUT_COMMIT: ${{ inputs.commit }}

branding:
  icon: 'upload-cloud'
  color: 'green'
