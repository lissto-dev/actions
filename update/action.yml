name: 'Lissto Update'
description: 'Update an existing Lissto stack with new images'
author: 'Lissto'

inputs:
  api-key:
    description: 'Lissto API key'
    required: true
  api-url:
    description: 'Lissto API URL'
    required: true
  environment:
    description: 'Target environment'
    required: true
  stack:
    description: 'Stack name (optional, updates all if not specified)'
    required: false
  branch:
    description: 'Git branch for image version'
    required: false
  tag:
    description: 'Image tag'
    required: false
  commit:
    description: 'Commit SHA for image version'
    required: false
  cli-version:
    description: 'Override CLI version (e.g., v0.5.0). Uses image default if not set.'
    required: false

outputs:
  stack-id:
    description: 'Updated stack ID'
  status:
    description: 'Update status'
  updated-services:
    description: 'Comma-separated list of updated services'

runs:
  using: 'docker'
  image: '../src/Dockerfile'
  env:
    LISSTO_ACTION: update
    INPUT_API_KEY: ${{ inputs.api-key }}
    INPUT_API_URL: ${{ inputs.api-url }}
    INPUT_ENVIRONMENT: ${{ inputs.environment }}
    INPUT_STACK: ${{ inputs.stack }}
    INPUT_BRANCH: ${{ inputs.branch }}
    INPUT_TAG: ${{ inputs.tag }}
    INPUT_COMMIT: ${{ inputs.commit }}
    INPUT_CLI_VERSION: ${{ inputs.cli-version }}

branding:
  icon: 'refresh-cw'
  color: 'orange'
